{% extends 'base.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    {% block content %}

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            margin-top:70px ;
        }
        form {
            border: 2px solid;
            border-radius: 10px;
            width: fit-content;
            padding: 20px;
            text-align: center;
            margin-left: 35%;
            margin-top: 2%;
            margin-bottom: 5%;
            font-size: 25px;
            box-shadow: 4px 4px 5px;
        }
        input {
            width: 100%;
            height: 30px;
            border-radius: 3px;
            margin-top: 20px;
            margin-bottom: 20px;
            font-size: 20px;
            padding: 20px;
        }
        button {
            width: 100%;
            height: 25px;
        }
        p {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <nav>
        <img src="https://img.freepik.com/free-vector/hand-drawn-wedding-planner-twitter-header_23-2149259521.jpg?ga=GA1.1.1626343651.1695441162&semt=ais_hybrid" alt="">
        <ul>
            <li><a class="list" href="{% url 'home' %}">Home</a></li>
            <li><a class="list" href="{% url 'Login2' %}">Login</a></li>
        </ul>
    </nav>

    <h1>Login Form</h1>
    <form action="{% url 'Login2' %}" method="post">
        {% csrf_token %}
        <input type="text" name="username" id="username" placeholder="Enter your username"><br><br>
        <input type="password" name="password" id="password" placeholder="Enter registered password"><br><br>
        <button type="submit">Login</button>
        <p>Don't have an account? <a href="{% url 'Login' %}">Sign up</a> here</p>
    </form>

    {% endblock %}
</body>
</html>
